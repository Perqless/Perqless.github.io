<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Perqless - About Me</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h1>About Me</h1>
    <p>Timezone: AEST</p>
    <p id="timeDiff"></p>
    <script>
      const myOffset = 10; 
      const visitorOffset = new Date().getTimezoneOffset() / -60;

      const diff = visitorOffset - myOffset;
      document.getElementById("timeDiff").innerText = 
        diff === 0 
         ? "We are in the same timezone!" 
          : `You are ${Math.abs(diff)} hour(s) ${diff > 0 ? "ahead" : "behind"} me.`;
    </script>
    <h2>Contact Me</h2>
    <p>Discord Username: "perqless"</p>
    <h2>Socials</h2>
    <p>x(Twitter):<a href="https://x.com/perqIess">x.com</a></p>
  </div>
</body>
</html>
